name: AnkiDroid Odak APK

on:
  push:
    branches: [odak]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Derle
        env:
          ODAK_BUILD: "true"
          MINIFY_ENABLED: "false"
        run: |
          echo "fatal_warnings=false" > local.properties
          chmod +x gradlew
          ./gradlew :AnkiDroid:assemblePlayRelease \
            -PcustomSuffix=odak -PcustomName="AnkiDroid Odak" \
            -Duniversal-apk=true --no-configuration-cache --stacktrace
          VERSION=$(grep -oP 'versionName="\K[^"]+' AnkiDroid/build.gradle)
          ODAK=$(cat ODAK_VERSION | tr -d '[:space:]')
          TAG="v${VERSION}-odak.${ODAK}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p out
          for f in AnkiDroid/build/outputs/apk/play/release/*.apk; do
            name=$(basename "$f" .apk | sed 's/^AnkiDroid-play-//; s/-release$//')
            cp "$f" "out/AnkiDroid-Odak-${TAG}-${name}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: AnkiDroid-Odak-apk
          path: out/*.apk

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: AnkiDroid Odak ${{ env.TAG }}
          body_path: ODAK_RELEASE_NOTES.md
          files: out/*.apk
          make_latest: true
